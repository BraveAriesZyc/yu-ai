
#user  nobody;
worker_processes 1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
  worker_connections 1024;
}


http {
  include mime.types;
  default_type application/octet-stream;

  types {
    application/javascript  js mjs;
    text/css                css;
    text/html               html;
  }

  sendfile on;
  # tcp_nopush     on;

  #keepalive_timeout  0;
  # keepalive_timeout 65;

  # gzip on;
  # gzip_buffers 32 16k;
  # gzip_comp_level 6;
  # gzip_min_length 1k;
  # gzip_static on;
  # gzip_types text/plain
  #   text/css
  #   application/javascript
  #   application/json
  #   application/x-javascript
  #   text/xml
  #   application/xml
  #   application/xml+rss
  #   text/javascript; #设置压缩的文件类型
  # gzip_vary on;

  # WebSocket 升级头映射(M20):$http_upgrade 有值时透传 Connection: upgrade
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 8080;
    server_name localhost;

    # admin-api 反代(M20 同域反代定稿):proxy_pass 不带 URI = /admin-api/ 前缀原样透传后端;
    # 32m 对齐后端 spring.servlet.multipart max-request-size(头像/相册/聊天图片上传)
    location /admin-api/ {
      proxy_pass http://127.0.0.1:48080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 32m;
    }

    # 基础设施 WebSocket(yudao /infra/ws,App 聊天实时通道共用):
    # HTTP/1.1 + 升级头必配,否则 WS 握手 400;超时 300s 防空闲断连
    location /infra/ws {
      proxy_pass http://127.0.0.1:48080;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # 前端静态资源(hash 路由,回退 index.html);
    # 同域反代后无跨域,CORS 头已删(M20)
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      index index.html;
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
  }
}
